<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | PhotoJudge</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

    <a href="../index.html" class="logo">
        PhotoJudge
    </a>

    <ul class="nav-links" id="mainNav"></ul>

</nav>


    <!-- Register Section -->

    <main class="auth-section">

        <div class="auth-container">

            <p class="small-heading">
                JOIN PHOTOJUDGE
            </p>

            <h1>
                Create Your Account
            </h1>

            <p class="auth-description">
                Register to participate in photo contests
                or judge submitted photographs.
            </p>


            <form id="registerForm">

                <!-- Name -->

                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Role Selection -->

                <div class="form-group">
                    <label>Register As</label>
                    <div class="role-selector">
                        <label class="role-option active" id="roleParticipantOption">
                            <input
                                type="radio"
                                name="registerRole"
                                value="participant"
                                checked
                            >
                            <span class="role-title">Participant</span>
                            <span class="role-desc">Submit photos to contests</span>
                        </label>

                        <label class="role-option" id="roleJudgeOption">
                            <input
                                type="radio"
                                name="registerRole"
                                value="judge"
                            >
                            <span class="role-title">Contest Judge</span>
                            <span class="role-desc">Evaluate submissions</span>
                        </label>
                    </div>
                </div>


                <!-- Judge-Only Fields -->

                <div id="judgeFieldsContainer" class="judge-fields" style="display: none;">

                    <div class="judge-alert">
                        <strong>Official Judge Registration:</strong> Requires an authorized organizer access key.
                    </div>

                    <div class="form-group">
                        <label for="judgeAccessKey">
                            Judge Access Key <span style="color: #dc2626;">*</span>
                        </label>
                        <input
                            type="password"
                            id="judgeAccessKey"
                            placeholder="Enter organizer secret key"
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="judgeSpecialization">
                            Specialization / Title
                        </label>
                        <input
                            type="text"
                            id="judgeSpecialization"
                            placeholder="e.g. Senior Wildlife Photographer"
                            maxlength="80"
                        >
                    </div>

                    <div class="form-group">
                        <label for="judgeBio">
                            Short Bio / Credentials
                        </label>
                        <textarea
                            id="judgeBio"
                            rows="2"
                            placeholder="e.g. 10+ years experience, nature documentary specialist"
                            maxlength="200"
                        ></textarea>
                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="auth-message"
                ></p>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 PhotoJudge. All rights reserved.
        </p>

    </footer>


    <script src="../js/auth.js"></script>

</body>

</html>
