    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Judge Dashboard | PhotoJudge</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/judge.css">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            PhotoJudge
        </div>

        <ul class="nav-links">

            <li>
                <a href="../index.html">Home</a>
            </li>

            <li>
                <a href="contests.html">Contests</a>
            </li>

            <li>
                <a href="judge.html">Judge</a>

            <li>

        </ul>

    </nav>


    <!-- =========================
         JUDGE DASHBOARD
    ========================== -->

    <main class="judge-section">

        <div class="judge-header">

            <p class="small-heading">
                JUDGE DASHBOARD
            </p>

            <h1>
                Review Submitted Photographs
            </h1>

            <p>
                Evaluate each photograph using the three
                contest criteria.
            </p>

        </div>


        <!-- Entries will be displayed here -->

        <div
            id="judgeEntriesContainer"
            class="judge-entries-container"
        >
        </div>


        <div
            id="noJudgeEntries"
            class="no-judge-entries"
        >

            <h2>
                No submissions available
            </h2>

            <p>
                Participants have not submitted any photographs yet.
            </p>

        </div>

    </main>


    <footer>
